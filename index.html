<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Nefrit Market — Onlayn Do'kon</title>
    <meta name="description"
        content="Nefrit Market — sifatli mahsulotlar, qulay narxlar. Telegram orqali buyurtma bering!">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* ===== NEFRIT JADE THEME ===== */
        :root {
            --blue: #0D6B50;
            --green: #1FAD80;
            --red: #E63946;
            --orange: #F4845F;
            --bg: #EEF7F2;
            --card: #FFFFFF;
            --text: #0B2318;
            --sub: #5C8A76;
            --border: #B8D9CC;
            --shadow: 0 4px 20px rgba(13, 107, 80, .10);
            --shadow-lg: 0 10px 44px rgba(13, 107, 80, .18);
            --jade-glow: 0 0 20px rgba(29, 173, 128, .25);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh
        }

        .hidden {
            display: none !important
        }

        /* ===== HEADER ===== */
        .sf-header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(238, 247, 242, .88);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            border-bottom: 1px solid var(--border);
            padding: 12px 16px
        }

        .sf-header-inner {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            gap: 12px
        }

        .sf-logo {
            font-size: 20px;
            font-weight: 900;
            flex: 1;
            background: linear-gradient(135deg, #0D6B50 0%, #1FAD80 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text
        }

        .icon-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: none;
            background: rgba(29, 173, 128, .12);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--blue);
            font-size: 17px;
            transition: transform .15s, background .2s
        }

        .icon-btn:hover {
            background: rgba(29, 173, 128, .22)
        }

        .icon-btn:active {
            transform: scale(.9)
        }

        /* ===== SEARCH ===== */
        .search-wrap {
            max-width: 900px;
            margin: 0 auto;
            padding: 12px 16px 0
        }

        .search-box {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--card);
            border-radius: 14px;
            padding: 10px 14px;
            box-shadow: var(--shadow);
            border: 1.5px solid var(--border);
            transition: border-color .2s
        }

        .search-box:focus-within {
            border-color: var(--blue);
            box-shadow: var(--jade-glow)
        }

        .search-box input {
            border: none;
            outline: none;
            flex: 1;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 15px;
            color: var(--text);
            background: transparent
        }

        .search-box input::placeholder {
            color: var(--sub)
        }

        /* ===== CATEGORIES ===== */
        .cats-wrap {
            max-width: 900px;
            margin: 0 auto;
            padding: 14px 0 0
        }

        .cats-scroll {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 0 16px 12px;
            scrollbar-width: none
        }

        .cats-scroll::-webkit-scrollbar {
            display: none
        }

        .cat-pill {
            flex-shrink: 0;
            padding: 7px 18px;
            border-radius: 20px;
            border: 1.5px solid var(--border);
            cursor: pointer;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 14px;
            font-weight: 700;
            background: var(--card);
            color: var(--sub);
            box-shadow: var(--shadow);
            transition: all .2s
        }

        .cat-pill.active {
            background: linear-gradient(135deg, #0D6B50, #1FAD80);
            color: #fff;
            border-color: transparent;
            transform: scale(1.05);
            box-shadow: 0 4px 16px rgba(13, 107, 80, .30)
        }

        .cat-pill:active {
            transform: scale(.95)
        }

        /* ===== PRODUCTS ===== */
        .products-section {
            max-width: 900px;
            margin: 0 auto;
            padding: 4px 16px 100px
        }

        .section-title {
            font-size: 18px;
            font-weight: 800;
            margin-bottom: 12px;
            color: var(--text)
        }

        .products-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px
        }

        @media(min-width:600px) {
            .products-grid {
                grid-template-columns: repeat(3, 1fr)
            }
        }

        @media(min-width:900px) {
            .products-grid {
                grid-template-columns: repeat(4, 1fr)
            }
        }

        .product-card {
            background: var(--card);
            border-radius: 22px;
            overflow: hidden;
            box-shadow: var(--shadow);
            cursor: pointer;
            transition: transform .22s, box-shadow .22s;
            position: relative;
            border: 1.5px solid var(--border)
        }

        .product-card:active {
            transform: scale(.97)
        }

        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
            border-color: rgba(29, 173, 128, .45)
        }

        .product-img-wrap {
            position: relative;
            aspect-ratio: 1;
            overflow: hidden;
            background: #e8f5ef
        }

        .product-img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform .3s
        }

        .product-card:hover .product-img-wrap img {
            transform: scale(1.04)
        }

        .stock-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background: var(--red);
            color: #fff;
            font-size: 10px;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 10px
        }

        .product-info {
            padding: 11px 12px 13px
        }

        .product-name {
            font-size: 13px;
            font-weight: 700;
            line-height: 1.3;
            margin-bottom: 5px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden
        }

        .product-price {
            font-size: 14px;
            font-weight: 900;
            color: var(--blue);
            margin-bottom: 3px
        }

        .product-stock {
            font-size: 11px;
            color: var(--sub);
            font-weight: 600
        }

        .product-stock.low {
            color: var(--orange)
        }

        .loading-spinner {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            font-size: 14px;
            font-weight: 700;
            color: var(--sub);
            gap: 10px
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px
        }

        .empty-icon {
            font-size: 48px;
            margin-bottom: 12px
        }

        .empty-title {
            font-size: 17px;
            font-weight: 800;
            margin-bottom: 6px
        }

        .empty-sub {
            font-size: 14px;
            color: var(--sub)
        }

        /* ===== FOOTER ===== */
        .sf-footer {
            text-align: center;
            padding: 20px 16px;
            color: var(--sub);
            font-size: 13px;
            font-weight: 600;
            border-top: 1px solid var(--border);
            background: linear-gradient(180deg, #fff 0%, #EEF7F2 100%);
            margin-top: 20px
        }

        .sf-footer a {
            color: var(--blue);
            text-decoration: none;
            font-weight: 700
        }

        /* ===== MODAL ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 200;
            background: rgba(7, 38, 28, .5);
            backdrop-filter: blur(6px);
            opacity: 0;
            pointer-events: none;
            transition: opacity .3s;
            display: flex;
            align-items: flex-end
        }

        .modal-overlay.open {
            opacity: 1;
            pointer-events: all
        }

        @media(min-width:700px) {
            .modal-overlay {
                align-items: center;
                justify-content: center
            }
        }

        .modal-sheet {
            background: var(--card);
            border-radius: 28px 28px 0 0;
            width: 100%;
            max-height: 92vh;
            overflow-y: auto;
            padding: 0 0 40px;
            transform: translateY(100%);
            transition: transform .35s cubic-bezier(.34, 1.2, .64, 1);
            border-top: 2px solid rgba(29, 173, 128, .25)
        }

        .modal-overlay.open .modal-sheet {
            transform: translateY(0)
        }

        @media(min-width:700px) {
            .modal-sheet {
                border-radius: 28px;
                max-width: 500px;
                max-height: 88vh;
                transform: scale(.92)
            }

            .modal-overlay.open .modal-sheet {
                transform: scale(1)
            }
        }

        .modal-drag {
            width: 44px;
            height: 4px;
            background: var(--border);
            border-radius: 4px;
            margin: 14px auto 0
        }

        .modal-img {
            width: 100%;
            aspect-ratio: 4/3;
            object-fit: cover
        }

        .modal-media {
            position: relative
        }

        .modal-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 36px;
            height: 36px;
            border: none;
            border-radius: 50%;
            background: rgba(13, 107, 80, .75);
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px
        }

        .modal-nav.prev {
            left: 10px
        }

        .modal-nav.next {
            right: 10px
        }

        .modal-thumbs {
            display: flex;
            gap: 8px;
            padding: 10px 14px 0;
            overflow-x: auto
        }

        .modal-thumb {
            width: 64px;
            height: 64px;
            border-radius: 12px;
            object-fit: cover;
            cursor: pointer;
            border: 2.5px solid transparent;
            flex-shrink: 0;
            transition: border-color .2s
        }

        .modal-thumb.active {
            border-color: var(--blue)
        }

        .modal-body {
            padding: 20px 20px 0
        }

        .modal-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 12px
        }

        .modal-name {
            font-size: 20px;
            font-weight: 900;
            line-height: 1.25;
            flex: 1
        }

        .close-btn {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: none;
            background: var(--bg);
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--sub);
            flex-shrink: 0;
            transition: background .2s
        }

        .close-btn:hover {
            background: #d5ede4
        }

        .modal-price {
            font-size: 26px;
            font-weight: 900;
            color: var(--blue);
            margin-bottom: 8px
        }

        .modal-stock-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 700;
            background: var(--bg);
            padding: 5px 14px;
            border-radius: 20px;
            margin-bottom: 16px;
            border: 1px solid var(--border)
        }

        .modal-stock-pill.ok {
            color: var(--green)
        }

        .modal-stock-pill.low {
            color: var(--orange)
        }

        .modal-desc {
            font-size: 14px;
            line-height: 1.75;
            color: #3a6655;
            margin-bottom: 24px
        }

        .tg-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 16px;
            border-radius: 18px;
            border: none;
            background: linear-gradient(135deg, #0D6B50, #1FAD80);
            color: #fff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 6px 20px rgba(13, 107, 80, .35);
            transition: transform .15s, box-shadow .2s
        }

        .tg-btn:hover {
            box-shadow: 0 8px 28px rgba(13, 107, 80, .45)
        }

        .tg-btn:active {
            transform: scale(.97)
        }

        .tg-btn.disabled-btn {
            opacity: .5;
            pointer-events: none
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: linear-gradient(135deg, #0B3325, #0D6B50);
            color: #fff;
            padding: 12px 22px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 700;
            z-index: 500;
            opacity: 0;
            transition: all .3s;
            white-space: nowrap;
            pointer-events: none;
            box-shadow: 0 6px 24px rgba(13, 107, 80, .35)
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0)
        }
    </style>
</head>

<body>

    <!-- STOREFRONT -->
    <header class="sf-header">
        <div class="sf-header-inner">
            <div class="sf-logo">Nefrit<span>Market</span> 🌿</div>
            <button class="icon-btn" id="search-toggle-btn" onclick="toggleSearch()" title="Qidirish">🔍</button>
        </div>
    </header>

    <div class="search-wrap hidden" id="search-box-wrap">
        <div class="search-box">
            <span>🔍</span>
            <input type="search" id="search-input" placeholder="Mahsulot qidiring..." oninput="filterProducts()"
                autocomplete="off" />
        </div>
    </div>

    <div class="cats-wrap">
        <div class="cats-scroll" id="cats-scroll"></div>
    </div>

    <div class="products-section">
        <div class="section-title">Mahsulotlar</div>
        <div id="products-grid">
            <div class="loading-spinner" style="grid-column:1/-1">⏳ Yuklanmoqda...</div>
        </div>
        <div class="empty-state hidden" id="empty-state">
            <div class="empty-icon">🔍</div>
            <div class="empty-title">Mahsulot topilmadi</div>
            <div class="empty-sub">Boshqa so'z bilan qidiring yoki kategoriyani o'zgartiring</div>
        </div>
    </div>

    <footer class="sf-footer">
        🌿 Nefrit Market &nbsp;|&nbsp; <a href="https://t.me/" id="footer-tg-link" target="_blank">Telegram orqali
            bog'laning</a>
    </footer>

    <!-- PRODUCT MODAL -->
    <div class="modal-overlay" id="product-modal" onclick="closeModalOverlay(event)">
        <div class="modal-sheet">
            <div class="modal-drag"></div>
            <div class="modal-media">
                <img class="modal-img" id="modal-img" src="" alt="">
                <button class="modal-nav prev hidden" id="modal-prev" onclick="modalPrevImage()">‹</button>
                <button class="modal-nav next hidden" id="modal-next" onclick="modalNextImage()">›</button>
            </div>
            <div class="modal-thumbs" id="modal-thumbs"></div>
            <div class="modal-body">
                <div class="modal-top">
                    <div class="modal-name" id="modal-name"></div>
                    <button class="close-btn" onclick="closeProductModal()">✕</button>
                </div>
                <div class="modal-price" id="modal-price"></div>
                <div class="modal-stock-pill" id="modal-stock"></div>
                <div class="modal-desc" id="modal-desc"></div>
                <a class="tg-btn" id="modal-tg-btn" href="#" target="_blank">✈️ Telegram orqali sotib olish</a>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // ===== CONFIG (faqat PUBLIC kalitlar) =====
        const SUPABASE_URL = "https://hyfpxpbabnwokiczzaiy.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_6lP5lPxj3DOz44OZvOcdDw_eTrLL-Qs";
        const IK_URL = "https://ik.imagekit.io/zaveeqnja";
        const TG_USERNAME = "yourusername"; // ← default, Supabase'dan ham o'qiladi

        // IK_PRIVATE_KEY bu faylda YO'Q — xavfsizlik ta'minlangan!

        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let categories = [];
        let products = [];
        let activeCategory = 'all';
        let searchOpen = false;
        let currentModalImages = [];
        let currentModalIndex = 0;
        let tgUsername = TG_USERNAME;

        // ===== HELPERS =====
        function normalizeTg(v) { return (v || '').trim().replace(/^@+/, ''); }

        function ikTransform(url, w = 500, q = 80) {
            if (!url || !url.includes('imagekit.io')) return url;
            return url.includes('?') ? `${url}&tr=w-${w},q-${q}` : `${url}?tr=w-${w},q-${q}`;
        }

        function getProductImages(p) {
            return [p.image_url, p.image_url_2, p.image_url_3].filter(Boolean);
        }

        function getMainImg(p) {
            return ikTransform(getProductImages(p)[0]) || null;
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg; t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2800);
        }

        // ===== LOAD DATA =====
        async function loadAll() {
            try {
                const [cRes, pRes] = await Promise.all([
                    sb.from('categories').select('*').order('created_at'),
                    sb.from('products').select('*').order('created_at', { ascending: false })
                ]);
                if (!cRes.error) categories = cRes.data || [];
                else console.error('Categories xatosi:', cRes.error.message);
                if (!pRes.error) products = pRes.data || [];
                else console.error('Products xatosi:', pRes.error.message);
            } catch (e) {
                console.error('Supabase ulanish xatosi:', e);
                const grid = document.getElementById('products-grid');
                if (grid) grid.innerHTML = '<div class="loading-spinner" style="grid-column:1/-1;color:#E63946">⚠️ Ma\'lumotlar yuklashda xatolik. Sahifani yangilang.</div>';
                throw e; // yuqoriga uzatish
            }
        }

        async function loadTelegramUsername() {
            try {
                const { data, error } = await sb.from('shop_settings').select('tg_username').eq('id', 1).maybeSingle();
                if (!error && data?.tg_username) tgUsername = normalizeTg(data.tg_username);
            } catch (_) { }
            const ftg = document.getElementById('footer-tg-link');
            if (ftg && tgUsername) ftg.href = `https://t.me/${tgUsername}`;
        }

        // ===== SEARCH =====
        function toggleSearch() {
            searchOpen = !searchOpen;
            const wrap = document.getElementById('search-box-wrap');
            wrap.classList.toggle('hidden', !searchOpen);
            if (searchOpen) document.getElementById('search-input').focus();
            else { document.getElementById('search-input').value = ''; renderProducts(); }
        }

        // ===== CATEGORIES =====
        function renderCats() {
            const all = [{ id: 'all', name: 'Barchasi', emoji: '🏪' }, ...categories];
            document.getElementById('cats-scroll').innerHTML = all.map(c => `
        <button class="cat-pill ${activeCategory == c.id ? 'active' : ''}" onclick="setCat('${c.id}')">
          ${c.emoji || ''} ${c.name}
        </button>`).join('');
        }

        function setCat(id) {
            activeCategory = id === 'all' ? 'all' : parseInt(id);
            renderCats(); renderProducts();
        }

        function filterProducts() { renderProducts(); }

        // ===== PRODUCTS =====
        function renderProducts() {
            const q = (document.getElementById('search-input')?.value || '').toLowerCase().trim();
            const grid = document.getElementById('products-grid');
            const empty = document.getElementById('empty-state');
            const list = products.filter(p => {
                const mc = activeCategory === 'all' || p.cat_id === activeCategory;
                const mq = !q || p.name.toLowerCase().includes(q) || (p.description || '').toLowerCase().includes(q);
                return mc && mq;
            });
            if (!list.length) { grid.innerHTML = ''; empty.classList.remove('hidden'); return; }
            empty.classList.add('hidden');
            grid.className = 'products-grid';
            grid.innerHTML = list.map(p => {
                const img = getMainImg(p);
                const imgHtml = img
                    ? `<img src="${img}" alt="${p.name}" loading="lazy">`
                    : `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:40px;color:var(--border)">🛍️</div>`;
                const stockBadge = p.stock === 0
                    ? `<div class="stock-badge">Tugadi!</div>`
                    : p.stock < 3 ? `<div class="stock-badge">Tugayapti!</div>` : '';
                const stockLabel = p.stock === 0
                    ? `<div class="product-stock low">❌ Tugadi</div>`
                    : p.stock < 3
                        ? `<div class="product-stock low">⚠️ Kam qoldi: ${p.stock} ta</div>`
                        : `<div class="product-stock">✅ Mavjud: ${p.stock} ta</div>`;
                return `
          <div class="product-card" onclick="openProduct(${p.id})">
            <div class="product-img-wrap">${imgHtml}${stockBadge}</div>
            <div class="product-info">
              <div class="product-name">${p.name}</div>
              <div class="product-price">${Number(p.price).toLocaleString()} so'm</div>
              ${stockLabel}
            </div>
          </div>`;
            }).join('');
        }

        // ===== MODAL =====
        function openProduct(id) {
            const p = products.find(x => x.id === id); if (!p) return;
            const imgs = getProductImages(p).map(u => ikTransform(u, 900, 88));
            currentModalImages = imgs; currentModalIndex = 0;

            const mainImgEl = document.getElementById('modal-img');
            if (imgs.length) { mainImgEl.src = imgs[0]; mainImgEl.style.display = 'block'; }
            else { mainImgEl.style.display = 'none'; }

            document.getElementById('modal-thumbs').innerHTML = imgs.map((img, i) =>
                `<img class="modal-thumb ${i === 0 ? 'active' : ''}" src="${img}" alt="${p.name}" onclick="setModalImage(${i},this)">`
            ).join('');

            const hasMultiple = imgs.length > 1;
            document.getElementById('modal-prev').classList.toggle('hidden', !hasMultiple);
            document.getElementById('modal-next').classList.toggle('hidden', !hasMultiple);

            document.getElementById('modal-name').textContent = p.name;
            document.getElementById('modal-price').textContent = Number(p.price).toLocaleString() + " so'm";

            const sEl = document.getElementById('modal-stock');
            if (p.stock === 0) { sEl.className = 'modal-stock-pill low'; sEl.innerHTML = '❌ Tugadi'; }
            else if (p.stock < 3) { sEl.className = 'modal-stock-pill low'; sEl.innerHTML = `⚠️ Kam qoldi: ${p.stock} ta`; }
            else { sEl.className = 'modal-stock-pill ok'; sEl.innerHTML = `✅ Mavjud: ${p.stock} ta`; }

            document.getElementById('modal-desc').textContent = p.description || '';

            const tgBtn = document.getElementById('modal-tg-btn');
            const user = normalizeTg(tgUsername);
            if (user) {
                tgBtn.href = `https://t.me/${user}?text=Salom!%20${encodeURIComponent(p.name)}%20mahsulotini%20sotib%20olmoqchiman.`;
                tgBtn.classList.remove('disabled-btn');
            } else {
                tgBtn.href = '#'; tgBtn.classList.add('disabled-btn');
            }

            document.getElementById('product-modal').classList.add('open');
            document.body.style.overflow = 'hidden';
        }

        function closeModalOverlay(e) { if (e.target === document.getElementById('product-modal')) closeProductModal(); }

        function closeProductModal() {
            document.getElementById('product-modal').classList.remove('open');
            document.body.style.overflow = '';
            currentModalImages = []; currentModalIndex = 0;
        }

        function setModalImage(index, el) {
            currentModalIndex = index;
            document.getElementById('modal-img').src = currentModalImages[index];
            document.querySelectorAll('.modal-thumb').forEach(t => t.classList.remove('active'));
            if (el) el.classList.add('active');
        }

        function modalPrevImage() {
            if (!currentModalImages.length) return;
            const i = (currentModalIndex - 1 + currentModalImages.length) % currentModalImages.length;
            setModalImage(i, document.querySelectorAll('.modal-thumb')[i]);
        }

        function modalNextImage() {
            if (!currentModalImages.length) return;
            const i = (currentModalIndex + 1) % currentModalImages.length;
            setModalImage(i, document.querySelectorAll('.modal-thumb')[i]);
        }

        // Swipe support
        (function () {
            let startX = 0;
            document.addEventListener('DOMContentLoaded', () => {
                const modalImg = document.getElementById('modal-img');
                modalImg.addEventListener('touchstart', e => { startX = e.touches[0].clientX; }, { passive: true });
                modalImg.addEventListener('touchend', e => {
                    if (!currentModalImages.length || !startX) return;
                    const diff = e.changedTouches[0].clientX - startX;
                    if (Math.abs(diff) > 35) { diff > 0 ? modalPrevImage() : modalNextImage(); }
                    startX = 0;
                }, { passive: true });
            });
        })();

        // ===== ANALYTICS: tashrif yozish =====
        function recordVisit() {
            sb.from('page_views').insert({}).then(() => { }).catch(() => { });
        }

        // ===== INIT =====
        (async () => {
            try {
                await loadTelegramUsername();
                await loadAll();
                renderCats();
                renderProducts();
                recordVisit();
            } catch (e) {
                // Xato loadAll() ichida ko'rsatilgan — bu yerda qo'shimcha harakat shart emas
            }
        })();
    </script>
</body>

</html>
